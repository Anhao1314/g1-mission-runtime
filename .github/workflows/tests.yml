name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python (no-physics scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml lark pytest
          pip install -e . --no-deps
      - name: Static-scope regression tests
        # Mirrors the README read-only check: mission runtime (fake sessions),
        # plus pure IR/task-graph/validator/metrics tests. MuJoCo-dependent
        # tests are excluded: a fresh checkout has no third_party/ assets.
        run: >
          python -m pytest
          tests/test_m2_physical_halt_runtime.py
          tests/test_mission_runtime.py
          tests/test_mission_ir.py
          tests/test_task_graph.py
          tests/test_mission_validator.py
          tests/test_metrics_schema.py
          -q
          -k "not live_session_runs_a_stop_mission and not live_session_runs_a_grounded_walk"
      - name: Mock mission demo smoke
        run: python demos/mock_mission.py

  console:
    name: console (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Console data tests
        run: node --test console/web/data.test.js
